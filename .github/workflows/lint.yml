name: Format and Lint Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format and clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy

    - name: Check Formatting
      run: |
        # Apply clang-format in-place, then fail if git reports any diff.
        # This makes the CI's installed clang-format version the authority.
        find src include tests -name '*.cpp' -o -name '*.hpp' \
          | xargs clang-format -i
        git diff --exit-code || \
          (echo "ERROR: Files are not clang-formatted. Run clang-format -i on changed files." && exit 1)

    - name: Configure CMake for compilation database
      run: |
        cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run Clang-Tidy
      run: |
        # Run clang-tidy on target source files only
        find src -name '*.cpp' | xargs clang-tidy -p build
