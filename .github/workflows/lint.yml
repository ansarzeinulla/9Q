name: Format and Lint Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format and clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format clang-tidy

    - name: Check Formatting
      run: |
        # Check formatting of all source/header files. Dry-run and return non-zero exit on diff.
        find src include tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

    - name: Configure CMake for compilation database
      run: |
        cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run Clang-Tidy
      run: |
        # Run clang-tidy on target source files
        find src -name '*.cpp' | xargs clang-tidy -p build
