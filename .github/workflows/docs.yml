name: Build & Deploy Doxygen Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Clone Doxygen Awesome CSS Theme
      run: |
        git clone https://github.com/jothepro/doxygen-awesome-css.git doxygen-awesome-css

    - name: Install Doxygen and Graphviz
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz

    - name: Generate Documentation
      # This physically modifies the Doxyfile to ensure OUTPUT_DIRECTORY is set to docs
      run: |
        sed -i 's|^OUTPUT_DIRECTORY.*|OUTPUT_DIRECTORY = docs|g' Doxyfile
        doxygen Doxyfile

    - name: Verify Generated Files
      # This prints the directory structure to the GitHub log so we can inspect it
      run: |
        echo "=== Root Directory ==="
        ls -la
        echo "=== Docs Directory ==="
        ls -la docs || true
        echo "=== Docs/HTML Directory ==="
        ls -la docs/html || true

    - name: Setup Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs/html' # This must match where index.html was found in Step 1

  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4