name: C / C++

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang make

      - name: Build engine tests
        working-directory: engine
        run: make test

      - name: Run perft suite
        working-directory: engine
        run: make perft
