name: C++ Engine Build & Perft Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential clang

    - name: Build Minimax Engine & Perft Suite
      working-directory: ./engine
      run: make CXX=clang++

    - name: Run Perft Mathematical Verification (Depth 1-4)
      working-directory: ./engine
      run: make test CXX=clang++

    - name: Build Billion-Game Simulator
      working-directory: ./billion-game-generation
      run: make CXX=clang++

    - name: Build Shortest-Game Engine
      working-directory: ./shortest-game-generation
      run: make CXX=clang++