name: Engine CI

on:
  push:
  pull_request:

jobs:
  native:
    name: Native (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build engine
        run: make -C engine CXX=${{ matrix.cxx }}

      - name: Run native tests
        run: make -C engine test CXX=${{ matrix.cxx }}

      - name: Run DAG benchmark smoke
        run: ./engine/togyzkumalak_engine --benchmark --bot dag --positions 2 --threads 1 --noterminal --movetime-ms 1 --max-search-depth 2

  sanitizers:
    name: ASan UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run sanitizer tests
        run: >
          make -C engine test
          CXX=clang++
          CXXFLAGS="-std=c++17 -Wall -Wextra -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread"
