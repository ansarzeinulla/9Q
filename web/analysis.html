<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9Q Analysis</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="pgn-viewer-page">
      <nav class="topbar" aria-label="Navigation">
        <a class="wordmark" href="/">9Q</a>
        <div class="top-links">
          <span class="muted-link">Togyzkumalak PGN Viewer</span>
          <label class="language-control" for="analysis-language">
            <select id="analysis-language" aria-label="Language">
              <option value="en">🇬🇧 English</option>
              <option value="ru">🇷🇺 Русский</option>
              <option value="kk">🇰🇿 Қазақша</option>
              <option value="ky">🇰🇬 Кыргызча</option>
            </select>
          </label>
          <button id="play-from-here" type="button">Play from here</button>
          <a href="/">Back to Game</a>
        </div>
      </nav>

      <section class="pgn-viewer-layout">
        <div class="board-section">
          <div class="scoreline">
            <span><span class="side-label">Beginner</span> <strong id="white-kazan">0</strong></span>
            <span id="turn-label"></span>
            <span><span class="side-label">Follower</span> <strong id="black-kazan">0</strong></span>
          </div>

          <div id="board" class="board"></div>
        </div>

        <aside class="analysis-sidebar" aria-label="Analysis sidebar">
          <div class="board-controls">
            <div class="navigation-controls">
              <button id="nav-first" title="Go to beginning (Up arrow)">⏮</button>
              <button id="nav-prev" title="Previous move (Left arrow)">◀</button>
              <button id="rotate-board" title="Rotate Board">↺</button>
              <button id="nav-next" title="Next move (Right arrow)">▶</button>
              <button id="nav-last" title="Go to end (Down arrow)">⏭</button>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="dag-toggle" />
              <span class="toggle-label">DAG Analysis</span>
            </label>
          </div>

          <section class="sidebar-panel">
            <div class="sidebar-heading">
              <h2>Move History</h2>
              <p>Click any move to jump to that position.</p>
            </div>
            <div id="move-history" class="move-history"></div>
          </section>

          <section class="sidebar-panel">
            <div class="sidebar-heading">
              <h2>Engine Evaluations</h2>
              <p>Best lines from the current position.</p>
            </div>
            <div id="evaluations" class="evaluations"></div>
          </section>
        </aside>
      </section>
    </main>

    <script type="module" src="/togyzkumalak-pgn.js"></script>
  </body>
</html>
